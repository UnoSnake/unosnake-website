name: UnoSnake — Live Pilot

# ────────────────────────────────────────────
# MANUAL ONLY — no cron, no schedule.
# This is a validation tool, not an autopilot.
# ────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      confirm_pilot:
        description: "Type 'pilot' to confirm execution"
        required: true
        type: string

# One pilot at a time
concurrency:
  group: unosnake-live-pilot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ──────────────────────────────────
  # JOB 1 : Tests gate
  # ──────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run all tests
        run: |
          python tests/run_tests.py
          python tests/test_pinterest.py
          python tests/test_content.py
          python tests/test_scheduler.py
          python tests/test_production_hardening.py
          python tests/test_live_dry_run.py
          python tests/test_real_data_pilot.py

  # ──────────────────────────────────
  # JOB 2 : Live Pilot
  # ──────────────────────────────────
  live-pilot:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event.inputs.confirm_pilot == 'pilot' }}
    env:
      # Secrets
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}

      # HARD DISABLED — Pinterest cannot run during pilot
      PINTEREST_ENABLED: "false"
      PINTEREST_SANDBOX: "true"
      PINTEREST_ACCESS_TOKEN: ""
      PINTEREST_BOARD_ID: ""

      # Pilot mode
      LIVE_PILOT: "true"
      MAX_PILOT_AIRTABLE_WRITES: "1"
      TEST_MODE: "true"

      # Standard limits
      MAX_PUBLISH_PER_RUN: "1"
      MAX_CANDIDATES_PER_SEARCH: "10"
      MIN_PRODUCT_SCORE: "65"
      MAX_NICHES_PER_RUN: "3"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Verify Pinterest is DISABLED
        run: |
          if [ "$PINTEREST_ENABLED" != "false" ]; then
            echo "FATAL: Pinterest must be disabled during pilot"
            exit 1
          fi
          echo "✅ Pinterest is DISABLED"

      - name: Run Live Pilot
        run: python -m scripts.scheduler.autopilot --live-pilot

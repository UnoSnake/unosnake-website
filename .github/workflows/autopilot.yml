name: UnoSnake — Autopilot

# ────────────────────────────────────────────
# Cron : 4 runs/day, every 6 hours (UTC)
#   06:00 UTC = 08:00 Paris
#   12:00 UTC = 14:00 Paris
#   18:00 UTC = 20:00 Paris
#   00:00 UTC = 02:00 Paris (next day)
# ────────────────────────────────────────────

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no Pinterest publish, no Published transition)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# ────────────────────────────────────────────
# Concurrency: only ONE autopilot at a time.
# New run cancels pending (not in-progress).
# Prevents duplicate Pins.
# ────────────────────────────────────────────
concurrency:
  group: unosnake-autopilot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────
  # JOB 1 : Unit tests (gate)
  # ────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run all tests
        run: |
          python tests/run_tests.py
          python tests/test_pinterest.py
          python tests/test_content.py
          python tests/test_scheduler.py
          python tests/test_production_hardening.py
          python tests/test_live_dry_run.py
          python tests/test_real_data_pilot.py
          python tests/test_launch_gate.py

  # ────────────────────────────────────────
  # JOB 2 : Autopilot pipeline
  # ────────────────────────────────────────
  autopilot:
    runs-on: ubuntu-latest
    needs: test
    env:
      # Secrets
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
      PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}

      # Feature flags (safe defaults)
      TEST_MODE: "true"
      PINTEREST_ENABLED: "false"
      PINTEREST_SANDBOX: "true"
      PINTEREST_BOARD_ID: ""

      # Limits
      MAX_PUBLISH_PER_RUN: "1"
      MAX_CANDIDATES_PER_SEARCH: "10"
      MAX_ACCEPTED_PER_RUN: "10"
      MIN_PRODUCT_SCORE: "65"
      MAX_NICHES_PER_RUN: "3"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Run Autopilot
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          python -m scripts.scheduler.autopilot $DRY_RUN_FLAG

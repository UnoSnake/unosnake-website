name: UnoSnake - Airtable Products

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  read-airtable:
    runs-on: ubuntu-latest

    steps:
      - name: Read products from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          curl -s \
            -H "Authorization: Bearer $AIRTABLE_TOKEN" \
            "https://api.airtable.com/v0/app88FLN95xcB0QKF/tbl2RQvsmpBm3yAdW" \
            > products.json

          echo "===== AIRTABLE RESPONSE ====="
          cat products.json
          echo "============================="

name: UnoSnake Airtable Test

on:
  workflow_dispatch:

jobs:
  test-airtable:
    runs-on: ubuntu-latest

    steps:
      - name: Test Airtable connection
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: |
          echo "Testing Airtable connection..."

          RESPONSE=$(curl -sS \
            -w "\n%{http_code}" \
            -H "Authorization: Bearer ${AIRTABLE_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/Products")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: ${HTTP_CODE}"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Airtable connection failed."
            echo "$BODY"
            exit 1
          fi

          echo "Airtable connection successful."
          echo "$BODY"

name: UnoSnake - Process Selected Products

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  process-products:
    runs-on: ubuntu-latest

    steps:
      - name: Read selected products from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          curl -s \
            -H "Authorization: Bearer $AIRTABLE_TOKEN" \
            "https://api.airtable.com/v0/app88FLN95xcB0QKF/tbl2RQvsmpBm3yAdW" \
            > airtable.json

          echo "===== PRODUITS SELECTED ====="

          jq -r '
            .records[]
            | select(.fields.Status == "Selected")
            | {
                id: .id,
                product: .fields["Product Name"],
                amazon_url: .fields["Amazon URL"],
                category: .fields.Category,
                style: .fields.Style
              }
          ' airtable.json

          echo "=============================="

name: UnoSnake - Pinterest Sandbox Test

on:
  workflow_dispatch:

jobs:
  pinterest-test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Pinterest Sandbox API
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "UNO SNAKE - PINTEREST SANDBOX TEST"
          echo "========================================"

          HTTP_STATUS=$(curl -sS \
            -o pinterest-response.json \
            -w "%{http_code}" \
            -X GET \
            "https://api-sandbox.pinterest.com/v5/pins?page_size=5" \
            -H "Authorization: Bearer ${PINTEREST_ACCESS_TOKEN}" \
            -H "Content-Type: application/json")

          echo "HTTP STATUS: $HTTP_STATUS"
          echo ""
          echo "===== PINTEREST SANDBOX RESPONSE ====="

          cat pinterest-response.json | jq .

          if [ "$HTTP_STATUS" != "200" ]; then
            echo ""
            echo "ERREUR: Pinterest Sandbox inaccessible."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "PINTEREST SANDBOX : SUCCESS"
          echo "========================================"

name: UnoSnake — Production Check

# ────────────────────────────────────────────
# MANUAL ONLY — answers "Are we ready?"
# NEVER creates a Pin. Read-only readiness evaluation.
# ────────────────────────────────────────────

on:
  workflow_dispatch:

concurrency:
  group: unosnake-production-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ──────────────────────────────────
  # JOB 1 : Full test suite
  # ──────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run all tests
        run: |
          python tests/run_tests.py
          python tests/test_pinterest.py
          python tests/test_content.py
          python tests/test_scheduler.py
          python tests/test_production_hardening.py
          python tests/test_live_dry_run.py
          python tests/test_real_data_pilot.py
          python tests/test_launch_gate.py

  # ──────────────────────────────────
  # JOB 2 : Launch Gate readiness (NO Pin)
  # ──────────────────────────────────
  readiness:
    runs-on: ubuntu-latest
    needs: test
    env:
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
      PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
      # Current production config (read from repo secrets/vars)
      PINTEREST_ENABLED: ${{ vars.PINTEREST_ENABLED || 'false' }}
      PINTEREST_SANDBOX: ${{ vars.PINTEREST_SANDBOX || 'true' }}
      PINTEREST_BOARD_ID: ${{ vars.PINTEREST_BOARD_ID || '' }}
      TEST_MODE: ${{ vars.TEST_MODE || 'true' }}
      LIVE_PILOT: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Evaluate Launch Gate (read-only, no Pin)
        run: python -m scripts.pinterest.production_check
